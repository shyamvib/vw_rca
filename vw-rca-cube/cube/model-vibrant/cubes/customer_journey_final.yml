cubes:
  - name: journey
    sql_table: "`vibrant-lab-datamodels`.business_intelligence.bq_customer_journey_final"
    joins:
      - name: hubspot_contacts
        sql: "{CUBE}.contact_id = {hubspot_contacts}.contact_id"
        relationship: many_to_one
    dimensions:
      - { name: pk, sql: "CONCAT(CAST(contact_id AS STRING),'-',CAST(touchpoint_date AS STRING),'-',touchpoint_type,'-',IFNULL(CAST(touchpoint_detail AS STRING),''))", type: string, primary_key: true }
      - { name: contact_id, sql: contact_id, type: string }
      - { name: touchpoint_date, sql: "TIMESTAMP(SAFE_CAST(touchpoint_date AS DATETIME))", type: time }
      - { name: touchpoint_type, sql: touchpoint_type, type: string }
      - { name: touchpoint_category, sql: touchpoint_category, type: string }
      - { name: activity_type, sql: activityType, type: string }
      - { name: meeting_outcome, sql: meetingOutcome, type: string }
      - { name: zendesk_ticket_id, sql: zendesk_ticket_id, type: string }
      - { name: ticket_category, sql: ticket_category, type: string }
      - { name: provider_customer_id, sql: provider_customer_id, type: number }
      - { name: engagement_id, sql: "CAST(engagement_id AS STRING)", type: string }
    measures:
      - { name: touchpoints, type: count }
      - { name: last_touch, type: max, sql: "CAST(DATE(touchpoint_date) AS STRING)" }
      - { name: contacts, type: count_distinct, sql: contact_id }
      - name: tickets
        type: count_distinct
        sql: zendesk_ticket_id
        filters: [{ sql: "{CUBE}.zendesk_ticket_id IS NOT NULL" }]
    pre_aggregations:
      # Refresh (2026-11-06): every partition, all history, once a day at 12:00 UTC (an hour before the engine's
      # 13:00 UTC rebuild). Was hourly for the last 7 days only, so older months kept orders BigQuery later removed
      # or re-priced (2026 YTD was $574K / 864 orders too high). Check: scripts/revenue-reconcile.ts.
      - name: daily_touch
        measures: [touchpoints, contacts, tickets]
        dimensions: [touchpoint_type, touchpoint_category, activity_type]
        time_dimension: touchpoint_date
        granularity: day
        partition_granularity: month
        refresh_key: { every: "0 12 * * *", timezone: UTC, incremental: true, update_window: 4000 day }
      # vw-rca Phase 1: per-contact touch dates + last touch (pTouchAsOf,
      # pTouchDatesRaw, pClinicalTouchDatesRaw, newClinicTouches).
      - name: rca_contact_touch_day
        measures: [touchpoints, last_touch]
        dimensions: [contact_id, touchpoint_type, touchpoint_category]
        time_dimension: touchpoint_date
        granularity: day
        partition_granularity: month
        refresh_key: { every: "0 12 * * *", timezone: UTC, incremental: true, update_window: 4000 day }
