# DERIVED (not in BigQuery). Rebuilds Power BI 'Portfolio Changes' (clinic x test).
# Rules INFERRED from Power BI output (Thiru's DAX not yet received), 2026-10-03:
#   33-test whitelist (exact list from PBI), recent = last 28 days,
#   baseline = the 90 days before (changed from 84 on 2026-10-18), Baseline 28D Average = baseline x 28 / 90.
#   NEW = baseline 0 & recent >= 1 & never ordered before; RESTARTED = baseline 0 & recent >= 1 and 3+ orders before the
#   baseline window (added 2026-10-18, earlier_orders; fewer than 3 stays NEW); STOPPED = baseline >= 3 & recent 0;
#   DECLINING = baseline >= 6 & recent >= 1 & recent <= 0.5 x average.
# Known gap vs PBI: STOPPED 1,149 vs 1,218; NEW 1,965 vs 2,325; DECLINING 417 vs 192.
cubes:
  - name: portfolio_changes
    sql: >
      WITH anchor AS (
        SELECT MAX(DATE(order_date)) AS d FROM `vibrant-lab-datamodels`.business_intelligence.customer_rfm_segmented_orders_bq
      ),
      lines AS (
        SELECT o.clinic_id, ANY_VALUE(o.customer_practice_name) AS clinic_name,
               ANY_VALUE(o.sales_id) AS sales_id, t.test_name_v2 AS test_name,
               COUNT(DISTINCT IF(DATE(o.order_date) > DATE_SUB(a.d, INTERVAL 28 DAY), o.sample_id, NULL)) AS recent_orders,
               COUNT(DISTINCT IF(DATE(o.order_date) <= DATE_SUB(a.d, INTERVAL 28 DAY) AND DATE(o.order_date) > DATE_SUB(a.d, INTERVAL 118 DAY), o.sample_id, NULL)) AS baseline_orders,
               COUNT(DISTINCT IF(DATE(o.order_date) <= DATE_SUB(a.d, INTERVAL 118 DAY), o.sample_id, NULL)) AS earlier_orders,
               ANY_VALUE(a.d) AS anchor_date
        FROM `vibrant-lab-datamodels`.business_intelligence.customer_rfm_segmented_orders_bq o
        JOIN `vibrant-lab-datamodels`.business_intelligence.fact_orders_tests_enriched_bq t USING (sample_id)
        CROSS JOIN anchor a
        WHERE o.clinic_id IS NOT NULL
          AND t.test_name_v2 IN (
            'Comprehensive Metabolic Panel', 'Heavy Metals (Creatinine)', 'Mycotoxins', 'Gut Zoomer',
            'Wheat Zoomer DBS', 'Nutrient Zoomer Microtube', 'Dairy Zoomer', 'Lectin Zoomer',
            'Tick Borne 2.0', 'Environmental toxin', 'Tickborne Complete 1.0', 'Tick Borne 2.0 DBS',
            'Wheat Zoomer', 'Tickborne Complete 1.0 DBS', 'Wheat Zoomer - Leaky Gut Panel only DBS',
            'Egg Zoomer', 'Dairy Zoomer DBS', 'Total Tox', 'Nutrient Zoomer', 'Autoimmunity Zoomer',
            'Hormone Zoomer 2.0', 'Neural Zoomer Plus', 'Foundation Zoomer', 'Cardio Zoomer',
            'Food Zoomer', 'Toxin Genetics – Saliva', 'Neural Zoomer Plus DBS', 'Cellular Zoomer',
            'Food Zoomer DBS', 'Toxin Zoomer', 'Corn Zoomer', 'Soy Zoomer', 'Peanut Zoomer')
        GROUP BY o.clinic_id, t.test_name_v2
      ),
      s AS (
        SELECT *, baseline_orders * 28 / 90 AS baseline_28d_avg,
          CASE
            WHEN baseline_orders = 0 AND recent_orders >= 1 AND earlier_orders >= 3 THEN 'RESTARTED'
            WHEN baseline_orders = 0 AND recent_orders >= 1 THEN 'NEW'
            WHEN baseline_orders >= 3 AND recent_orders = 0 THEN 'STOPPED'
            WHEN baseline_orders >= 6 AND recent_orders >= 1 AND recent_orders <= 0.5 * baseline_orders * 28 / 90 THEN 'DECLINING'
          END AS status
        FROM lines
      )
      SELECT * FROM s WHERE status IS NOT NULL
    dimensions:
      - { name: pk, sql: "CONCAT(CAST(clinic_id AS STRING),'-',test_name)", type: string, primary_key: true }
      - { name: clinic_id, sql: clinic_id, type: number }
      - { name: clinic_name, sql: clinic_name, type: string }
      - { name: sales_id, sql: sales_id, type: number }
      - { name: test_name, sql: test_name, type: string }
      - { name: status, sql: status, type: string }
      - { name: baseline_orders, sql: baseline_orders, type: number }
      - { name: baseline_28d_avg, sql: baseline_28d_avg, type: number }
      - { name: recent_orders, sql: recent_orders, type: number }
      - { name: earlier_orders, sql: earlier_orders, type: number }
      - { name: anchor_date, sql: "CAST(anchor_date AS STRING)", type: string }
    measures:
      - { name: rows, type: count }
    pre_aggregations:
      - name: snapshot
        type: original_sql
        refresh_key: { every: 6 hour }
